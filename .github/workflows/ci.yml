name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Track the latest stable Go (org convention). go.mod floor is 1.26.4.
jobs:

  # Every file must be gofmt-clean.
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi

  # Reconcile the two checked-in inputs on every push.
  #
  # The unit tests prove families.json is a *valid* classification; this proves it
  # still agrees with the ecosystem as last fetched. Editing the curated file is
  # how a family loses its last organisation or an organisation ends up in two
  # families at once, and without this lane that is discovered by whoever next
  # regenerates the map — which is the worst moment to discover it.
  #
  # No network and no secret: it reads the committed inventory. Live drift needs a
  # token that can list every organisation, so it stays a deliberate `catalog
  # fetch` rather than something CI does behind your back.
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: catalog check
        run: go run ./cmd/catalog check | tee check.log
      # `check` exits 0 and prints nothing useful if the inventory were somehow
      # empty of families, so assert the shape of what it printed.
      - name: The map is not empty
        run: |
          grep -qE '^[0-9]+ organisations, [0-9]+ public code repositories$' check.log || {
            echo "::error::catalog check printed no summary"; exit 1; }
          families=$(grep -cE '^  .+ +[0-9]+ orgs$' check.log)
          echo "families: $families"
          [ "$families" -ge 10 ] || {
            echo "::error::only $families families; families.json looks truncated"; exit 1; }

  # Build, vet, race-test, and enforce 100% statement coverage on three OSes.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go version
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - name: Test + 100% coverage gate
        shell: bash
        run: |
          COVERPKG=$(go list ./... | paste -sd, -)
          go test -coverpkg="$COVERPKG" -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -n 25
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v t="$cov" 'BEGIN { exit !(t+0 >= 100.0) }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # The point of writing the merge logic in Go is that the browser runs the same
  # code. This job proves it: the whole suite, convergence properties included,
  # executed as WebAssembly under node.

  # Run the suite on the six supported 64-bit targets. amd64/arm64 run natively;
  # the rest run under qemu-user. This tool writes files that are compared as
  # text in review, so the interesting target is s390x: it is big-endian, and a
  # generator that produced different bytes there would publish a diff nobody
  # could explain.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - run: go env GOARCH && go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x,   qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      # apt has sat on this step for the better part of an hour, more than once,
      # on nothing this repository does. It is bounded and retried rather than
      # waited on, and bounding it is what identified the culprit: three
      # attempts of ten minutes each produced not one line of output from
      # apt-get update, while the install itself was never reached.
      #
      # The runner image already ships apt's package lists, so the install
      # usually needs no refresh at all. It is tried on the lists that are there
      # first, and they are only refreshed if that was not enough. apt is also
      # told to give up on a stuck mirror rather than sit on it, which is what
      # made the outer timeout the only thing stopping it.
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: Install qemu user-mode emulators
        run: |
          apt=(-y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          if timeout 240 sudo apt-get install "${apt[@]}" qemu-user qemu-user-binfmt; then
            exit 0
          fi
          for attempt in 1 2; do
            echo "::warning::the runner's package lists were not enough; refreshing them (attempt $attempt)"
            timeout 240 sudo apt-get update "${apt[@]}" || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock*
            sudo dpkg --configure -a || true
            if timeout 240 sudo apt-get install "${apt[@]}" qemu-user qemu-user-binfmt; then
              exit 0
            fi
          done
          echo "::error::qemu-user qemu-user-binfmt could not be installed"
          exit 1
      - name: Test under qemu (${{ matrix.goarch }})
        run: |
          base="${{ matrix.qemu }}"
          q=""
          for cand in "$base" "${base%-static}"; do
            command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
          done
          # ⛔ A missing emulator FAILS this lane. A lane that reports success for
          # an architecture it never ran is the one outcome this matrix exists to
          # rule out.
          if [ -z "$q" ]; then
            echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
            exit 1
          fi
          # Printed on purpose: without it, "ran under emulation" and "skipped" are
          # indistinguishable from a green tick.
          echo "running ${{ matrix.goarch }} under $q"
          GOARCH=${{ matrix.goarch }} go test -exec="$q" ./...

  # Every decoder here reads bytes from other participants. The seed corpus runs
  # in the ordinary test job; this one spends real time looking for new inputs,
  # which is how the snapshot validation rules in docs/design.md were found.
